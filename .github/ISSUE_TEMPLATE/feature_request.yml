name: 💡 功能建议 / Feature request
description: 提出新功能或改进 / Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem would this solve?
      description: 描述你的使用场景 / Describe your use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎么做 / Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案 / Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: 其他补充 / Additional context
